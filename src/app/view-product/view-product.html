<app-navbar></app-navbar>

<div class="mt-25 flex justify-center align-center flex-row w-full flex-wrap">
    <div class="bg-neutral-primary-soft block w-100 border border-default rounded-lg shadow-xs">
      <img class="rounded-t-base"
        class="rounded-lg w-full"
        [src]="'http://127.0.0.1:8000/images/' + product.product_image"
      />
    <div class="p-6 text-center">
      <span
        class="inline-flex items-center bg-brand-softer border border-brand-subtle text-fg-brand-strong text-xs font-medium px-1.5 py-0.5 rounded-sm"
      >
        <svg
          class="w-3 h-3 me-1"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18.122 17.645a7.185 7.185 0 0 1-2.656 2.495 7.06 7.06 0 0 1-3.52.853 6.617 6.617 0 0 1-3.306-.718 6.73 6.73 0 0 1-2.54-2.266c-2.672-4.57.287-8.846.887-9.668A4.448 4.448 0 0 0 8.07 6.31 4.49 4.49 0 0 0 7.997 4c1.284.965 6.43 3.258 5.525 10.631 1.496-1.136 2.7-3.046 2.846-6.216 1.43 1.061 3.985 5.462 1.754 9.23Z"
          />
        </svg>
        Trending
      </span>
        <h3 class="mt-3 mb-6 text-2xl font-semibold tracking-tight text-heading">
          {{ product.product_name }} ({{  product?.category?.category_name }})
        </h3>
        <h4 class="text-xl font-semibold text-heading">{{ product.product_company }}</h4>
        <p class="mt-3 mb-6 tracking-tight ">
            {{ product.product_description }}
        </p>
      <a
        routerLink="/productList"
        class="inline-flex items-center text-white bg-blue-500 box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
      >
        Back To List
        
      </a>
    </div>
  </div>
  <h4 class="w-full text-center text-green-500">Current Stock : <b>{{ product.product_quantity }}</b></h4>
  <div class="w-full flex justify-center gap-10 p-5">
    <button type="button" (click)="deleteProduct(product.id)" class="text-white bg-red-500 box-border border border-transparent hover:bg-warning-strong focus:ring-4 focus:ring-warning-medium shadow-xs font-medium leading-5 rounded-full text-sm px-4 py-2.5 focus:outline-none">DELETE</button>
    <button type="button" (click)="editProduct(product.id)" class="text-white bg-green-500 box-border border border-transparent hover:bg-dark-strong focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-full text-sm px-4 py-2.5 focus:outline-none">EDIT</button>
    <button type="button" class="text-heading bg-yellow-500 box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-full text-sm px-4 py-2.5 focus:outline-none">ADD STOCK</button>
  </div>
</div>
 
<router-outlet></router-outlet>
