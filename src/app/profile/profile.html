<app-navbar></app-navbar>

<div class="mt-20 w-screen flex justify-center align-center">
    <div class="border border-black rounded-lg gap-5 h-90 w-200 p-5 flex flex-row flex-wrap ">
        <div class="w-60 h-60 rounded-full border border-black">
            <img class="w-60 h-60 rounded-full" [src]="'http://127.0.0.1:8000/images/' + user.profile_image" alt="">
        </div>
        <div class="w-120 h-60 text-white border border-black text-center p-5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
            <h2 class="font-bold text-2xl">{{ user.user_name }}</h2>
            <h4 class="text-xl font-semibold mt-3">{{ user.user_email }}</h4>
            <h4 class="mt-2 text-xl font-semibold">{{ user.user_role }}</h4>
            <p class="mt-15 flex align-left">Created At : {{ user.created_at | date:'short' }}</p>
        </div>
        <a routerLink="/dashboard">
            <button type="button" class="text-white bg-blue-500 box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">Dashboard</button>
        </a>
    </div>
</div>

<router-outlet></router-outlet>
